name: OdysseusClient
options:
  bundleIdPrefix: com.rbc33
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "5"
    # Pon aquí tu Team ID o elígelo en Xcode (Signing & Capabilities)
    DEVELOPMENT_TEAM: ""
targets:
  Odysseus:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rbc33.odysseus
        PRODUCT_NAME: Odysseus
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Odysseus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Permite http:// a hosts sin dominio (rictow), .local e IPs (Tailscale 100.x)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Odysseus se conecta a tu servidor en la red local o Tailscale.
        NSFaceIDUsageDescription: Usa Face ID para desbloquear Odysseus.
        NSCameraUsageDescription: Para adjuntar fotos a los chats.
        NSPhotoLibraryUsageDescription: Para adjuntar imágenes a los chats.
        NSMicrophoneUsageDescription: Para el dictado por voz en Odysseus.
